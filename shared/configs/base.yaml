seed: 31050
data:
  input_shape: [9, 5, 30]
  num_joints: 14
  split_ratios: [0.8, 0.1, 0.1]
  split_group: participant
  wimans_band: "5"
  wimans_num_users: 1
model:
  channels: [32, 64, 128, 192]
  dropout: 0.20
training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  precision: auto
  auto_batch_size: true
  batch_multiple: 8
  memory_reserve_gib: 2.0
  memory_reserve_fraction: 0.10
  num_workers: auto
loss:
  coordinate_weight: 1.0
  bone_weight: 0.25
  symmetry_weight: 0.05
evaluation:
  pck_thresholds: [0.05, 0.10, 0.20]
  selection_metric: monitor_nme

